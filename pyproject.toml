[project]
name = "data-tracker"
version = "0.1.0"
description = "Daily tracker of stock, ETF and crypto prices, published to GitHub Pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests>=2.32"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
