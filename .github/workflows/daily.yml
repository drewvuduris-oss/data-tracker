name: Daily run

on:
  schedule:
    - cron: "40 21 * * *"   # main run, 21:40 UTC (after the 21:00 UTC US market close)
    - cron: "50 23 * * *"   # backup: only runs the pipeline if the main run did not happen that UTC day
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Tests
        run: uv run pytest -q

      - name: Fetch sources, build history, write status, open issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "50 23 * * *" ]; then
            uv run python -m tracker.run --if-missing
          else
            uv run python -m tracker.run
          fi

      - name: Check the history rebuilds identically from the raw files
        run: |
          cp data/history.csv /tmp/history.csv
          uv run python -m tracker.history
          cmp data/history.csv /tmp/history.csv

      - name: Commit data
        run: |
          git config user.name "data-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Daily run $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  pages:
    needs: run
    uses: ./.github/workflows/pages.yml
